name: Forex Factory Bot

on:
  schedule:
    # Monday to Friday at 7:00 AM UTC
    - cron: '0 7 * * 1-5'
    # Sundays at 18:00 UTC
    - cron: '0 18 * * 0'
  workflow_dispatch: # Allows manual execution from the GitHub Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Run script with uv
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --python 3.13 bot.py