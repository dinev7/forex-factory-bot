name: Forex Factory Bot

on:
  schedule:
    # Mon-Fri 02:07 New York time. The cron runs in the America/New_York timezone,
    # so EST/EDT changes are handled by GitHub.
    # The minute is deliberately not :00 (GitHub is busiest at the start of each hour).
    - cron: '7 2 * * 1-5'
      timezone: 'America/New_York'
    # Sundays 02:07 New York time (weekly report)
    - cron: '7 2 * * 0'
      timezone: 'America/New_York'
  workflow_dispatch: # Allows manual execution (and external triggers) via the GitHub API

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show what triggered this run
        run: echo "Event ${{ github.event_name }} (schedule '${{ github.event.schedule }}') started at $(date -u) UTC"

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Run script with uv
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --python 3.13 --with requests --with python-dotenv bot.py