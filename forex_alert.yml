name: Forex Factory Bot

on:
  schedule:
    # Lunes a viernes a las 07:00 AM UTC
    - cron: '0 7 * * 1-5'
    # Los domingos a las 18:00 PM UTC
    - cron: '0 18 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Run script with uv
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run bot.py
